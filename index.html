<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTX プレビュー（全画面）</title>
    <style>
        /* 画面全体の余白をゼロにし、スクロールバーを非表示にする */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* 背景を黒にして引き締める */
        }
        /* iframeを画面いっぱいに広げる */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://google.com"></iframe>

</body>
</html>
